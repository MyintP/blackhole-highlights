name: Update data

# Hourly: refresh scores, schedule, standings, stats, roster, injuries, news, podcasts and videos.
# Odds are only snapshotted from 12 hours to 1 hour before kickoff (logic in scripts/update.mjs).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will rebuild on the next push"
