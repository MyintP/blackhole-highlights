name: Update data

# Hourly: refresh scores, schedule, standings, stats, roster, injuries, news, podcasts and videos.
# Odds are only snapshotted from 12 hours to 1 hour before kickoff (logic in scripts/update.mjs).
# GitHub runs scheduled workflows late (every 3-6 hours on this repo), so around game time the job re-runs itself:
# the updater says how long to wait (hourly before kickoff, every 10 minutes during the game) and the last step
# dispatches the next run. Outside those windows the cron is all there is.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      chain_test:
        description: "Test the self-dispatch: schedule one follow-up run in 60 seconds (it won't chain further outside a game window)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  actions: write # dispatch the next run during game windows

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: update
        run: node scripts/update.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      # Health check before anything is published: schema, record counts, timestamps (scripts/check-site.mjs).
      # A failing check stops the commit, so the site keeps the last good data.
      - name: Validate data
        run: node scripts/check-site.mjs
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will rebuild on the next push"
      - name: Schedule the next run (game windows only)
        if: always() && (steps.update.outputs.wait != '' || inputs.chain_test)
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: ${{ inputs.chain_test && '60' || steps.update.outputs.wait }}
        run: |
          echo "Next run in $WAIT s"
          sleep "$WAIT"
          # A run already waiting (cron, or one held by the concurrency group) would start a second chain; let it carry on instead.
          queued=$(gh run list -R "${{ github.repository }}" -w update.yml -L 20 --json status -q '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "$queued" != "0" ]; then echo "A run is already queued"; exit 0; fi
          gh workflow run update.yml -R "${{ github.repository }}" --ref main
          echo "Dispatched the next run"
