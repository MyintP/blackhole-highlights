<!doctype html>
<!-- Source for og-image.png (1200x630 link-preview card). Re-render with headless Chrome:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=og-image.png og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#09090b;color:#f1f2f4}
.card{position:relative;width:1200px;height:630px;display:flex;align-items:center;gap:56px;padding:0 80px;box-sizing:border-box;border-bottom:8px solid #c9cdd2}
svg{flex:none}
h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:108px;line-height:.92;letter-spacing:.01em}
h1 em{font-style:normal;color:#9097a0}
p{margin:22px 0 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#c9cdd2}
small{position:absolute;right:80px;bottom:28px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#9097a0}
</style>
</head>
<body>
<div class="card">
  <svg width="380" height="380" viewBox="0 0 800 800" aria-hidden="true">
    <defs>
      <radialGradient id="halo" cx="400" cy="400" r="380" gradientUnits="userSpaceOnUse"><stop offset="0.5" stop-color="#000"/><stop offset="0.56" stop-color="#EEF0F2"/><stop offset="0.64" stop-color="#9AA0A8" stop-opacity="0.55"/><stop offset="0.8" stop-color="#3A3D42" stop-opacity="0.25"/><stop offset="1" stop-color="#070708" stop-opacity="0"/></radialGradient>
      <linearGradient id="disk" x1="40" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EEF0F2" stop-opacity="0"/><stop offset="0.25" stop-color="#C9CDD2"/><stop offset="0.5" stop-color="#FFF"/><stop offset="0.75" stop-color="#C9CDD2"/><stop offset="1" stop-color="#EEF0F2" stop-opacity="0"/></linearGradient>
    </defs>
    <circle cx="400" cy="400" r="380" fill="url(#halo)"/>
    <path d="M 60 400 A 340 46 0 0 1 740 400" fill="none" stroke="url(#disk)" stroke-width="8" opacity="0.6"/>
    <circle cx="400" cy="400" r="200" fill="#000"/>
    <text x="400" y="425" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="128" letter-spacing="6" fill="#EEF0F2">BHH</text>
    <path d="M 60 400 A 340 46 0 0 0 740 400" fill="none" stroke="url(#disk)" stroke-width="12"/>
  </svg>
  <div>
    <h1>BLACK HOLE<br><em>HIGHLIGHTS</em></h1>
    <p>Raiders news · stats · odds · clips</p>
  </div>
  <small>Fan-run · Not affiliated with the NFL or the Raiders</small>
</div>
</body>
</html>
